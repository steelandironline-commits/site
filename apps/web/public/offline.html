<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <title>AutoPix — sem conexão</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0b0d; color: #ecebe6;
        font-family: 'IBM Plex Sans', system-ui, sans-serif; text-align: center; padding: 24px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.4rem; margin: 20px 0 8px; }
      p { color: #868b94; max-width: 32ch; margin: 0 auto 20px; }
      button { height: 44px; padding: 0 20px; border-radius: 6px; border: 0; background: #2ad1b8; color: #03201b; font-weight: 600; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Seus agentes continuam trabalhando no servidor. Reconecte para ver as novidades.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
